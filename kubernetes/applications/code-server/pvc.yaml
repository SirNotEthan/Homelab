apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-home
  namespace: development
  labels:
    app.kubernetes.io/name: code-server
spec:
  accessModes:
    - ReadWriteOnce
  # Source code belongs in Git; using node-local storage avoids consuming two
  # scarce Longhorn replicas for disposable working copies and editor caches.
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
