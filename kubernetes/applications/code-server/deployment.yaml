apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: development
  labels:
    app.kubernetes.io/name: code-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: m910q-01
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-home
          image: docker.io/library/busybox:1.38.0
          command:
            - sh
            - -c
            - install -d -m 0750 -o 1000 -g 1000 /home/coder/workspace /home/coder/.config /home/coder/.local
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/coder
      containers:
        - name: code-server
          image: ghcr.io/coder/code-server:4.136.2
          imagePullPolicy: IfNotPresent
          args:
            - --bind-addr
            - 0.0.0.0:8080
            - --auth
            - password
            - --disable-telemetry
            - /home/coder/workspace
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-server-auth
                  key: PASSWORD
            - name: CODE_SERVER_APP_NAME
              value: Homelab Code
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: home
              mountPath: /home/coder
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: code-server-home
