apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "false"
            - name: LANGS
              value: en_GB
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            # Stirling's "full" image starts a JVM, LibreOffice, Xvfb, and
            # OCR tooling all at once - 1Gi isn't enough headroom for that
            # combined startup burst and trips its own internal resource
            # monitor, which aborts Spring Boot init before it ever binds
            # port 8080 (exits cleanly, so it just looks like a hung probe).
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: stirling-pdf-config
              mountPath: /configs
      volumes:
        - name: stirling-pdf-config
          persistentVolumeClaim:
            claimName: stirling-pdf-config
