apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentlens
  namespace: studentlens
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: studentlens
  template:
    metadata:
      labels:
        app: studentlens
    spec:
      initContainers:
        - name: database-schema
          image: ghcr.io/sirnotethan/studentlens:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - npm run db:push
          envFrom:
            - secretRef:
                name: studentlens-postgres
      containers:
        - name: studentlens
          image: ghcr.io/sirnotethan/studentlens:latest
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: LOG_LEVEL
              value: info
            - name: CLIENT_URL
              value: https://studentlens.net
            - name: SECURE_COOKIES
              value: "true"
            - name: DATABASE_PROVIDER
              value: appwrite
            - name: REDIS_URL
              value: redis://studentlens-redis.studentlens.svc.cluster.local:6379
            - name: GOOGLE_CALLBACK_URL
              value: https://studentlens.net/api/auth/google/callback
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_FROM
              value: '"StudentLens" <noreply@studentlens.net>'
            - name: ADMIN_IP_WHITELIST_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: studentlens-app-secrets
            - secretRef:
                name: studentlens-postgres
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: studentlens-uploads
