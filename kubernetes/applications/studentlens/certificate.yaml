apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studentlens-public
  namespace: studentlens
spec:
  secretName: studentlens-public-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-cloudflare
  dnsNames:
    - studentlens.net
    - www.studentlens.net
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studentlens-sirnotethan
  namespace: studentlens
spec:
  secretName: studentlens-sirnotethan-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-cloudflare
  dnsNames:
    - studentlens.sirnotethan.uk
