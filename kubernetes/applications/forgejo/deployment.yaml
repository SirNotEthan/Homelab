apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:10
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__DOMAIN
              value: git.apps.lab.sirnotethan.uk
            - name: GITEA__server__ROOT_URL
              value: https://git.apps.lab.sirnotethan.uk/
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            # HTTPS-only git remotes for now - no SSH port is exposed
            # outside the cluster, so skip standing up SSH ingress/NodePort.
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            # No open signups - create the first admin with the `forgejo
            # admin user create` command in the README instead.
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            # Config is fully env-driven, so skip the web install wizard -
            # without this, admin CLI commands refuse to run because the
            # instance considers itself uninstalled.
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data
