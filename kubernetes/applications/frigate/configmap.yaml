apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
data:
  config.yml: |
    mqtt:
      enabled: false

    # No Coral/GPU yet - CPU detection only. This is fine for one low-frame-rate
    # camera but will not scale to many cameras or high detection FPS.
    detectors:
      cpu1:
        type: cpu

    # go2rtc restreams the camera's RTSP feed so Frigate only opens one
    # connection to the camera itself. The C200 exposes two streams - pull
    # both, since detect and record want different resolutions.
    go2rtc:
      streams:
        tapo_cam_1:
          - rtsp://CHANGE_ME_USER:CHANGE_ME_PASS@CHANGE_ME_CAMERA_IP:554/stream1
        tapo_cam_1_sub:
          - rtsp://CHANGE_ME_USER:CHANGE_ME_PASS@CHANGE_ME_CAMERA_IP:554/stream2

    cameras:
      tapo_cam_1:
        ffmpeg:
          inputs:
            # Full 1080p stream - only used for recording, never decoded for
            # detection, so it doesn't cost CPU on every frame.
            - path: rtsp://127.0.0.1:8554/tapo_cam_1
              roles:
                - record
            # 640x360 sub-stream - cheap enough to run object detection on
            # CPU without saturating a core per camera.
            - path: rtsp://127.0.0.1:8554/tapo_cam_1_sub
              roles:
                - detect
        detect:
          width: 640
          height: 360
          fps: 5
        record:
          enabled: true
          retain:
            days: 7
            mode: motion
        snapshots:
          enabled: true
          retain:
            default: 14

    version: 0.14
