apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-watchdog
  namespace: cluster-watchdog
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        spec:
          serviceAccountName: cluster-watchdog
          restartPolicy: Never
          containers:
            - name: watchdog
              image: alpine/k8s:1.30.4
              command: ["/bin/sh", "/scripts/watch.sh"]
              envFrom:
                - secretRef:
                    name: cluster-watchdog-secrets
                    optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: cluster-watchdog-script
                defaultMode: 0555
