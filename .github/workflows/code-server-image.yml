name: Build code-server development image

on:
  push:
    branches:
      - main
    paths:
      - images/code-server/**
      - .github/workflows/code-server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: images/code-server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sirnotethan/homelab-code-server:0.1.0
            ghcr.io/sirnotethan/homelab-code-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
